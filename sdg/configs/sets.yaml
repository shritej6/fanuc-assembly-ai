# Synthetic image sets; counts are images, not scenes.
# Authored by Shritej Gunda.

defaults:
  chunk_size: 500
  s_per_image_estimate: 5.5
  image_size: {table: [1920, 1080], side: [1920, 1080], wrist: [1280, 720]}
  depth: {table: [640, 400], wrist: [848, 480]}   # what the real cell can send (DEPTH=True)
  material: black_pla
  spares: [M2_03, M2_02, M1_03, M6_02, M3_03, M4_04]   # RISK_RANKING_v0 print list (estimate)
  defect_types: [snapped_tab, missing_feature, scale_97, scale_103, warp, layer_split]
  foreign_objects: [screw_m3, tape_roll, cube_10mm]

# Pilot = the first 375 images of chunk 0 of each set (1,500 images). Specs are deterministic and the generator
# skips finished scenes, so the full run reuses every pilot image. Purpose: label QA on all outputs + real s/img.
pilot:
  images_per_set: 375
  sets: [A, B, C, D]

sets:
  A:
    images: 16000
    seed: 2000
    model: detector (Faster R-CNN or RT-DETR)
    cameras: [table, side]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    scene:
      products: 3
      assembly_step_weights: [0.35, 0.2, 0.15, 0.15, 0.15]   # step 0..4 per product
      defects_per_scene: [0, 2]
      wrong_part_trap_prob: 0.3
      spares_in_store: [0, 6]
      rejects: [0, 2]
      foreign_objects: [0, 2]
      cluster_prob: 0.35
      arm_in_view_prob: 0.4

  B:
    images: 24000          # ~800 per object (30 objects), per the stack
    seed: 3000
    model: wrist look-alike classifier
    cameras: [wrist]
    outputs: [rgb, bbox_2d_tight, instance_segmentation]
    per_object: 800
    target_plan: all_objects   # the wrist target cycles through all 30 objects
    scene:
      products: 3
      assembly_step_weights: [0.4, 0.15, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 0]
      wrong_part_trap_prob: 0.5
      spares_in_store: [0, 0]
      rejects: [0, 0]
      foreign_objects: [0, 1]
      cluster_prob: 0.5
      arm_in_view_prob: 0.0
    wrist:
      standoff_mm: [120.0, 260.0]   # fingertip-to-part height range over the target
      tilt_deg: [0.0, 20.0]
      target_offset_mm: 15.0

  C:
    images: 8000
    seed: 4000
    model: anomalib PatchCore (train on good only; defect renders are the test set)
    cameras: [wrist]
    outputs: [rgb, instance_segmentation, depth]
    good_fraction: 0.75
    target_plan: parts         # the wrist target cycles through the 24 parts
    scene:
      products: 3
      assembly_step_weights: [0.4, 0.15, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 1]
      wrong_part_trap_prob: 0.0
      spares_in_store: [0, 0]
      rejects: [0, 0]
      foreign_objects: [0, 0]
      cluster_prob: 0.2
      arm_in_view_prob: 0.0
    wrist: {standoff_mm: [120.0, 200.0], tilt_deg: [0.0, 10.0], target_offset_mm: 5.0}

  D:
    images: 6000
    seed: 5000
    model: build check (recipe check + Cosmos Reason 2 evaluation)
    cameras: [wrist, side]
    outputs: [rgb, depth, instance_segmentation]
    build_states: [seated, high, tilted, wrong_part]
    build_state_weights: [0.4, 0.2, 0.2, 0.2]
    high_mm: [1.5, 4.0]
    tilt_deg: [4.0, 12.0]
    scene:
      products: 3
      assembly_step_weights: [0.0, 0.25, 0.25, 0.25, 0.25]
      defects_per_scene: [0, 1]
      wrong_part_trap_prob: 0.0
      spares_in_store: [0, 6]
      rejects: [0, 1]
      foreign_objects: [0, 1]
      cluster_prob: 0.2
      arm_in_view_prob: 0.3
    wrist: {standoff_mm: [140.0, 220.0], tilt_deg: [0.0, 15.0], target_offset_mm: 5.0}

  # ---------------------------------------------------------------- edge-case sets (docs/SDG_PLAN.md section 11)
  # Same models as A-D, trained on the union. Each set pushes one axis past the nominal ranges, so the models see
  # the bad cases the real cell can produce. E stays reserved for GR00T demos.

  F:                       # detector under bad light, bad sensor and a drifted camera mount
    images: 8000
    seed: 6000
    model: detector (Faster R-CNN or RT-DETR)
    cameras: [table, side]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    scene:
      products: 3
      assembly_step_weights: [0.35, 0.2, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 2]
      wrong_part_trap_prob: 0.3
      spares_in_store: [0, 6]
      rejects: [0, 2]
      foreign_objects: [0, 2]
      cluster_prob: 0.35
      arm_in_view_prob: 0.4
      pose_sampling: uniform
    randomization: &hard_look
      camera_jitter: {translate_mm: 15.0, rotate_deg: 2.5}   # table / side mounts only; wrist stays nominal
      lighting:
        dome_intensity_scale: [0.15, 3.0]
        rect_intensity_scale: [0.1, 3.5]
        color_temperature_k: [2700, 7500]
      black_pla:
        base_color_rgb: [[0.008, 0.008, 0.008], [0.08, 0.08, 0.08]]   # other filament batches, dusty prints
        roughness: [0.2, 0.85]
        specular: [0.3, 0.7]
        layer_line_normal_strength: [0.0, 1.0]
      post:
        motion_blur_prob: 0.4
        gaussian_noise_sigma: [0.0, 0.04]
        jpeg_quality: [45, 95]

  G:                       # detector in heavy clutter: touching clusters, arm occluding, full store and tray
    images: 8000
    seed: 7000
    model: detector (Faster R-CNN or RT-DETR)
    cameras: [table, side]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    scene:
      products: 3
      assembly_step_weights: [0.5, 0.2, 0.1, 0.1, 0.1]   # mostly unbuilt: the most loose parts
      defects_per_scene: [0, 3]
      wrong_part_trap_prob: 0.6
      spares_in_store: [4, 6]
      rejects: [1, 3]
      foreign_objects: [1, 3]
      cluster_prob: 0.9
      arm_in_view_prob: 0.8
      pose_sampling: uniform

  H:                       # wrist look-alike classifier, hard: rare poses, touching neighbours, off-centre, steep
    images: 12000          # 400 per object
    seed: 8000
    model: wrist look-alike classifier
    cameras: [wrist]
    outputs: [rgb, bbox_2d_tight, instance_segmentation]
    per_object: 400
    target_plan: all_objects
    scene:
      products: 3
      assembly_step_weights: [0.4, 0.15, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 0]
      wrong_part_trap_prob: 1.0
      spares_in_store: [0, 0]
      rejects: [0, 0]
      foreign_objects: [0, 2]
      cluster_prob: 0.9
      arm_in_view_prob: 0.0
      pose_sampling: uniform
    wrist: {standoff_mm: [90.0, 320.0], tilt_deg: [0.0, 30.0], target_offset_mm: 40.0}
    randomization: *hard_look

  I:                       # PatchCore under hard conditions: good parts must not alarm, defects must still show
    images: 6000
    seed: 9000
    model: anomalib PatchCore (good renders extend the training set; defect renders are test only)
    cameras: [wrist]
    outputs: [rgb, instance_segmentation, depth]
    good_fraction: 0.6
    target_plan: parts
    scene:
      products: 3
      assembly_step_weights: [0.4, 0.15, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 1]
      wrong_part_trap_prob: 0.0
      spares_in_store: [0, 0]
      rejects: [0, 0]
      foreign_objects: [0, 0]
      cluster_prob: 0.5
      arm_in_view_prob: 0.0
      pose_sampling: uniform
    wrist: {standoff_mm: [100.0, 240.0], tilt_deg: [0.0, 20.0], target_offset_mm: 15.0}
    randomization: *hard_look

  J:                       # build check at the decision boundary: barely high, barely tilted, seated within tolerance
    images: 6000
    seed: 10000
    model: build check (recipe check + Cosmos Reason 2 evaluation)
    cameras: [wrist, side]
    outputs: [rgb, depth, instance_segmentation]
    build_states: [seated, high, tilted, wrong_part]
    build_state_weights: [0.4, 0.25, 0.25, 0.1]
    seated_noise_mm: 0.3   # a seated print may sit up to 0.3 mm proud and is still seated
    high_mm: [0.4, 1.5]    # D covers 1.5-4.0; labels carry the exact offset (build_offset)
    tilt_deg: [1.0, 4.0]   # D covers 4-12
    scene:
      products: 3
      assembly_step_weights: [0.0, 0.25, 0.25, 0.25, 0.25]
      defects_per_scene: [0, 1]
      wrong_part_trap_prob: 0.0
      spares_in_store: [0, 6]
      rejects: [0, 1]
      foreign_objects: [0, 1]
      cluster_prob: 0.3
      arm_in_view_prob: 0.3
    wrist: {standoff_mm: [120.0, 260.0], tilt_deg: [0.0, 20.0], target_offset_mm: 10.0}

  # ---------------------------------------------------------------- close-ups (section 11)
  # Close standoffs so each part's shape, edges and layer lines fill more of the frame.

  K:                       # every object, every resting pose, close up: what each part looks like
    images: 2400           # 80 per object
    seed: 11000
    model: wrist look-alike classifier + detector fine-tune (photoreal subset)
    cameras: [wrist]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    per_object: 80
    target_plan: all_objects
    scene:
      products: 3
      assembly_step_weights: [0.4, 0.15, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 0]
      wrong_part_trap_prob: 0.5
      spares_in_store: [0, 0]
      rejects: [0, 0]
      foreign_objects: [0, 1]
      cluster_prob: 0.5
      arm_in_view_prob: 0.0
      pose_sampling: uniform
    wrist: {standoff_mm: [70.0, 180.0], tilt_deg: [0.0, 25.0], target_offset_mm: 10.0}
    randomization: *hard_look

  L:                       # assembled structure close up: every product at every step, mostly seated
    images: 1600
    seed: 12000
    model: build check (recipe check + Cosmos Reason 2 evaluation), photoreal subset
    cameras: [wrist, side]
    outputs: [rgb, depth, instance_segmentation]
    build_states: [seated, high, tilted, wrong_part]
    build_state_weights: [0.55, 0.15, 0.15, 0.15]
    seated_noise_mm: 0.3
    high_mm: [0.4, 4.0]
    tilt_deg: [1.0, 12.0]
    scene:
      products: 3
      assembly_step_weights: [0.0, 0.25, 0.25, 0.25, 0.25]
      defects_per_scene: [0, 1]
      wrong_part_trap_prob: 0.0
      spares_in_store: [0, 6]
      rejects: [0, 1]
      foreign_objects: [0, 1]
      cluster_prob: 0.3
      arm_in_view_prob: 0.0
    wrist: {standoff_mm: [80.0, 200.0], tilt_deg: [0.0, 20.0], target_offset_mm: 10.0}

  M:                       # mis-assembly: shifted off the pegs, turned the wrong way, tilted, wrong look-alike
    images: 6000           # (edge cases EC-016/029/032/033/035/089/091). Every mis-built part rests ON the stack:
    seed: 13000            # lifted by sdg/data/build_clearance.json, labelled with shift / yaw / tilt / lift
    model: build check (recipe check + Cosmos Reason 2 evaluation)
    cameras: [wrist, side]
    outputs: [rgb, depth, instance_segmentation]
    build_states: [seated, shifted, rotated, tilted, high, wrong_part]
    build_state_weights: [0.3, 0.2, 0.2, 0.1, 0.1, 0.1]
    seated_noise_mm: 0.3
    high_mm: [0.5, 3.0]
    tilt_deg: [1.0, 12.0]
    shift_mm: [0.5, 4.0]
    scene:
      products: 3
      assembly_step_weights: [0.0, 0.25, 0.25, 0.25, 0.25]
      defects_per_scene: [0, 1]
      wrong_part_trap_prob: 0.0
      spares_in_store: [0, 6]
      rejects: [0, 1]
      foreign_objects: [0, 1]
      cluster_prob: 0.3
      arm_in_view_prob: 0.3
    wrist: {standoff_mm: [100.0, 240.0], tilt_deg: [0.0, 20.0], target_offset_mm: 10.0}

  # ---------------------------------------------------------------- test-bed sets
  # The arm only picks and places straight down and cannot turn a part over, so on the real test-bed every loose part
  # (and every spare) stands exactly as it sits in its product, at any yaw: pose_sampling: installed. A fallen_prob
  # share lies in another resting pose (label rest: fallen); the planner rejects those and takes a spare.

  N:                       # detector on the real test-bed: installed orientation, any yaw, nominal look
    images: 20000
    seed: 14000
    model: detector (Faster R-CNN or RT-DETR)
    cameras: [table, side]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    scene:
      products: 3
      assembly_step_weights: [0.35, 0.2, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 2]
      wrong_part_trap_prob: 0.5
      spares_in_store: [0, 6]
      rejects: [0, 2]
      foreign_objects: [0, 2]
      cluster_prob: 0.4
      arm_in_view_prob: 0.4
      pose_sampling: installed
      spares_any_part: true     # a few spares of any of the 24 parts, never a base
      fallen_prob: 0.1

  R:                       # detector on the test-bed under bad light, noise, clutter and look-alikes side by side
    images: 10000
    seed: 15000
    model: detector (Faster R-CNN or RT-DETR)
    cameras: [table, side]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    scene:
      products: 3
      assembly_step_weights: [0.5, 0.2, 0.1, 0.1, 0.1]
      defects_per_scene: [0, 2]
      wrong_part_trap_prob: 1.0
      spares_in_store: [2, 6]
      rejects: [0, 2]
      foreign_objects: [1, 3]
      cluster_prob: 0.8
      arm_in_view_prob: 0.5
      pose_sampling: installed
      spares_any_part: true     # a few spares of any of the 24 parts, never a base
      fallen_prob: 0.1
    randomization: *hard_look

  O:                       # identity close-ups at ONE wrist height: a fixed mm-per-pixel makes 1-1.5 mm size gaps
    images: 24000          # between look-alikes visible; 800 per object, a look-alike always beside the target
    seed: 16000
    model: wrist look-alike classifier
    cameras: [wrist]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    per_object: 800
    target_plan: all_objects
    scene:
      products: 3
      assembly_step_weights: [0.4, 0.15, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 0]
      wrong_part_trap_prob: 1.0
      spares_in_store: [0, 0]
      rejects: [0, 0]
      foreign_objects: [0, 1]
      cluster_prob: 0.7
      arm_in_view_prob: 0.0
      pose_sampling: installed
      spares_any_part: true     # a few spares of any of the 24 parts, never a base
      fallen_prob: 0.1
    wrist: {standoff_mm: [147.0, 153.0], tilt_deg: [0.0, 3.0], target_offset_mm: 8.0}   # planner identity height 150 mm

  P:                       # insertion alignment from the wrist: top part over / on its pegs, slightly off, labelled
    images: 12000          # with the exact shift / yaw / tilt / height (build_offset) so a model can read "how far off"
    seed: 17000
    model: insertion alignment + seated check (wrist)
    cameras: [wrist]
    outputs: [rgb, depth, instance_segmentation]
    build_states: [seated, shifted, rotated, tilted, high, wrong_part]   # wrong_part: a look-alike that may seat fully
    build_state_weights: [0.27, 0.22, 0.18, 0.09, 0.14, 0.10]             # (M1_01 / M2_01 drop into F03: fit != identity)
    seated_noise_mm: 0.3
    high_mm: [0.3, 3.0]
    tilt_deg: [0.5, 10.0]
    shift_mm: [0.3, 3.0]
    scene:
      products: 3
      assembly_step_weights: [0.0, 0.25, 0.25, 0.25, 0.25]
      defects_per_scene: [0, 0]
      wrong_part_trap_prob: 0.0
      spares_in_store: [0, 6]
      rejects: [0, 1]
      foreign_objects: [0, 1]
      cluster_prob: 0.3
      arm_in_view_prob: 0.0
      pose_sampling: installed
      spares_any_part: true     # a few spares of any of the 24 parts, never a base
      fallen_prob: 0.05
    wrist: {standoff_mm: [80.0, 160.0], tilt_deg: [0.0, 10.0], target_offset_mm: 6.0}

  Q:                       # fallen parts and the spare store: what to reject and what to pick instead
    images: 4000
    seed: 18000
    model: detector (Faster R-CNN or RT-DETR)
    cameras: [table, side]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    scene:
      products: 3
      assembly_step_weights: [0.35, 0.2, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 2]
      wrong_part_trap_prob: 0.3
      spares_in_store: [3, 6]
      rejects: [1, 3]
      foreign_objects: [0, 2]
      cluster_prob: 0.4
      arm_in_view_prob: 0.4
      pose_sampling: installed
      spares_any_part: true     # a few spares of any of the 24 parts, never a base
      fallen_prob: 0.5

  S:                       # weak spots measured on the test set and real CSI photos
    images: 3000           # small parts + M3 screw, connector products 4-6 standing and fallen, defects, and the
    seed: 19000            # CSI marker cards / camera housing as unlabelled not-a-part objects
    model: detector (Faster R-CNN or RT-DETR)
    cameras: [table, side]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    scene:
      products: 3
      product_weights: [1, 1, 1, 3, 3, 3]
      assembly_step_weights: [0.5, 0.2, 0.1, 0.1, 0.1]
      defects_per_scene: [1, 3]
      wrong_part_trap_prob: 0.7
      spares_in_store: [2, 6]
      rejects: [0, 2]
      foreign_objects: [1, 3]
      foreign_weights: [4, 1, 1]          # screw_m3, tape_roll, cube_10mm (defaults.foreign_objects order)
      cluster_prob: 0.5
      arm_in_view_prob: 0.4
      pose_sampling: installed
      spares_any_part: true
      fallen_prob: 0.3
      extra_parts:
        pool: [M1_02, M2_02, M3_02, M4_02, M5_02, M6_02, M4_04, M5_04, M6_04, M4_03, M5_03, M6_03, M5_01, M6_01]
        count: [2, 4]
      distractors: {marker_card: [1, 3], camera_box: [0, 1]}
    randomization: *hard_look

  T:                       # wrist look-alikes the classifier confuses (M4_04/M5_04 ~30 %, rear guards ~20 %), at
    images: 1500           # the O identity height; 30 % defective targets so the rear guards also get bad crops
    seed: 20000
    model: wrist look-alike classifier
    cameras: [wrist]
    outputs: [rgb, bbox_2d_tight, instance_segmentation, depth]
    per_object: 300
    target_plan: [M4_04, M5_04, M1_04, M2_04, M3_04]
    good_fraction: 0.7
    scene:
      products: 3
      assembly_step_weights: [0.4, 0.15, 0.15, 0.15, 0.15]
      defects_per_scene: [0, 0]
      wrong_part_trap_prob: 1.0
      spares_in_store: [0, 0]
      rejects: [0, 0]
      foreign_objects: [0, 1]
      cluster_prob: 0.7
      arm_in_view_prob: 0.0
      pose_sampling: installed
      spares_any_part: true
      fallen_prob: 0.1
    wrist: {standoff_mm: [147.0, 153.0], tilt_deg: [0.0, 3.0], target_offset_mm: 8.0}

randomization:              # applied by the Isaac generator to every scene
  camera_jitter: {translate_mm: 6.0, rotate_deg: 0.8}   # real camera mounts are calibrated; keep this small
  lighting:
    dome_intensity_scale: [0.5, 1.6]
    rect_intensity_scale: [0.4, 1.8]
    color_temperature_k: [3500, 6500]
  black_pla:
    base_color_rgb: [[0.015, 0.015, 0.015], [0.045, 0.045, 0.045]]
    roughness: [0.35, 0.65]
    specular: [0.4, 0.6]
    layer_line_normal_strength: [0.0, 0.6]
  post:
    motion_blur_prob: 0.15
    gaussian_noise_sigma: [0.0, 0.015]
    jpeg_quality: [80, 98]   # the cell sends JPEG when IMAGE_FORMAT is jpeg
