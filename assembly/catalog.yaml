# CAD installation offsets locate the STL part origin in the product fixture's
# CAD frame. Installed rotations map the STL print frame into that same frame.
# Motion planning must transform both through the measured fixture pose; neither
# value is an absolute UF0 TCP target. Gripper rolls are T29 grasp-frame offsets:
# commanded TCP r = measured part yaw + roll_offset_deg. T29 defines X-closing
# grips as 90 degrees and Y-closing grips as 0 degrees.
