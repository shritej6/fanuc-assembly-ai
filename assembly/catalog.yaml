# CAD installation offsets are [x, y, z] millimetres in the local frame of
# the detected base/fixture. They must be transformed through the measured
# base pose before motion planning; they are never absolute UF0 TCP targets.
products:
  - product: 1
    name: Rotary Knob Module
    base_type: A
    steps:
      - step: 1
        object_id: M1_01
        insert_offset_mm: [0, 0, 0]
        gripper_roll_deg: 0
      - step: 2
        object_id: M1_02
        insert_offset_mm: [0, 0, 7]
        gripper_roll_deg: 0
      - step: 3
        object_id: M1_03
        insert_offset_mm: [0, 0, 18]
        gripper_roll_deg: 0
      - step: 4
        object_id: M1_04
        insert_offset_mm: [0, 17.5, 4]
        gripper_roll_deg: 0

