[project]
name = "fanuc-cell-client"
version = "0.1.0"
description = "Client for Track 3 of the Physical AI Hackathon for the Factory Floor (2026): run a policy on the FANUC ER-4iA cell"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "msgpack>=1.1,<2",
    "msgpack-numpy>=0.4.8,<1",
    "numpy",
    "opencv-python-headless",
    "pyyaml>=6.0.3",
    "requests",
    "pyzmq>=26,<28",
]

[tool.uv]
package = false
