[project]
name = "fanuc-assembly-ai"
version = "0.1.0"
description = "Self-inspecting robotic assembly cell (FANUC ER-4iA, Rockwell + NVIDIA Physical AI Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# CAD source and assembly sheets (cad/); versions of the workspace that produced the committed sheets
cad = ["cadquery>=2.8", "matplotlib>=3.11", "numpy>=1.26"]

[tool.uv]
default-groups = ["dev", "cad"]

[tool.ruff]
line-length = 120
extend-exclude = ["robot/cell", "sim/starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
