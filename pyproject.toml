[project]
name = "fanuc-assembly-ai"
version = "0.1.0"
description = "Self-inspecting robotic assembly cell (FANUC ER-4iA, Rockwell + NVIDIA Physical AI Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "numpy>=2",
    "pillow>=10",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# CAD source and assembly sheets (cad/); versions of the workspace that produced the committed sheets
cad = ["cadquery>=2.8", "matplotlib>=3.11", "numpy>=1.26"]
ml = [
    "accelerate>=1.1,<2",
    "pycocotools>=2.0.7,<3",
    "safetensors>=0.4.5,<1",
    "scipy>=1.14,<2",
    "timm>=1,<2",
    "torch==2.14.1",
    "torchmetrics[detection]>=1.6,<2",
    "torchvision==0.29.1",
    "transformers==5.21.0",
]

[tool.uv]
default-groups = ["dev", "cad"]

[tool.ruff]
line-length = 120
extend-exclude = ["robot/cell", "sim/starter"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
