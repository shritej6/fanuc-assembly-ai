[project]
name = "fanuc-assembly-ai"
version = "0.1.0"
description = "Self-inspecting robotic assembly cell (FANUC ER-4iA, Rockwell + NVIDIA Physical AI Hackathon 2026)"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
extend-exclude = ["robot/cell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
